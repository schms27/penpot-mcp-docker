name: Rebuild Docker Image (Nightly)

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC daily
  workflow_dispatch:

env:
  DOCKERHUB_REPO: sebathi/penpot-mcp-docker

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --tag "${DOCKERHUB_REPO}:latest" \
            --cache-from "type=gha" \
            --cache-to "type=gha,mode=max" \
            .

      - name: Summary
        if: always()
        run: |
          echo "### Nightly Rebuild" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rebuilt **latest** tag from @penpot/mcp@stable." >> "$GITHUB_STEP_SUMMARY"
